<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>INE 315 · Exam timer</title>
<style>
:root{
  color-scheme:light;
  --background:#fbfcfe; --surface:#ffffff; --ink:#162539; --muted:#526275;
  --line:#d8e0e8; --red:#bb2f35; --deep-red:#6a101a; --blue:#174d80;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;min-height:100vh;min-height:100svh;background:var(--background);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column}
header,footer{width:min(1180px,100%);margin:0 auto;padding:18px 28px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px}
.course{font-size:clamp(.92rem,1.5vw,1.15rem);font-weight:650;letter-spacing:.035em}
button,a{touch-action:manipulation}
button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:10px 17px;background:var(--surface);color:var(--ink)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
button:disabled{cursor:default;opacity:.55}
main{flex:1;width:min(1180px,100%);margin:auto;padding:20px 28px 30px;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center}
h1{font-size:clamp(1.45rem,3.25vw,2.8rem);line-height:1.2;margin:0 0 18px;font-weight:700}
.clock-label{text-transform:uppercase;letter-spacing:.13em;color:var(--muted);font-size:.85rem;font-weight:600;margin:0 0 5px}
.clock{font-size:clamp(2.8rem,15vw,12rem);line-height:1.1;font-weight:700;letter-spacing:-.045em;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum";white-space:nowrap}
.ready-warning{margin:26px auto 0;padding:17px 24px;max-width:880px;background:#fff7ed;border-left:5px solid var(--red);
  text-align:left;font-size:clamp(1.1rem,2.05vw,1.65rem);line-height:1.45}
.ready-warning p{margin:4px 0}
.ready-warning p:nth-child(2){font-weight:750}
.stage-message{max-width:39ch;margin:25px auto 0;font-size:clamp(1.35rem,2.65vw,2.25rem);line-height:1.4;font-weight:600}
.start{margin-top:25px;background:var(--ink);border-color:var(--ink);color:white;
  font-size:clamp(1.1rem,1.8vw,1.4rem);font-weight:650;padding:13px 34px}
body[data-urgency="warning"] h1,body[data-urgency="warning"] .clock{color:var(--red)}
body[data-urgency="critical"] h1,body[data-urgency="critical"] .clock{color:var(--deep-red)}
body[data-phase="submission"] h1,body[data-phase="submission"] .clock{color:var(--blue)}
body[data-phase="finished"] h1,body[data-phase="finished"] .stage-message{color:var(--deep-red)}
body[data-phase="finished"] .clock{font-size:clamp(3rem,10vw,8rem)}
footer{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;color:var(--muted);font-size:.9rem}
footer a{color:var(--muted);text-underline-offset:3px}
details{text-align:right}
summary{cursor:pointer;padding:8px 0}
.control-actions{padding:10px 0 0;display:flex;justify-content:flex-end}
.storage-notice{max-width:650px;color:var(--deep-red);font-size:.95rem;margin:16px 0 0}
noscript{display:block;padding:18px;text-align:center;color:var(--deep-red);font-weight:650}
@media(max-width:540px){
  header,footer{padding:15px 18px}main{padding:18px 18px 24px}
  header{align-items:flex-start}.course{max-width:15em}
  header button{padding:8px 10px;font-size:.85rem}
  .ready-warning{padding:13px 15px;margin-top:20px}
  footer{align-items:center;font-size:.82rem}
}
@media(max-height:760px) and (min-width:700px){
  main{padding-top:5px;padding-bottom:12px}
  .clock{font-size:min(13vw,9rem)}h1{margin-bottom:9px}
  .ready-warning{margin-top:14px;padding:9px 20px;font-size:1.15rem}
  .start{margin-top:15px}.stage-message{margin-top:16px}
}
</style>
</head>
<body data-phase="ready" data-urgency="normal">
<header>
  <div class="course">INE 315 · Final examination</div>
  <button type="button" id="fullscreenButton" aria-label="Enter full screen">Full screen</button>
</header>
<main>
  <h1 id="phaseLabel" role="status" aria-live="polite">The exam has not started</h1>
  <p class="clock-label" id="clockLabel">Exam duration</p>
  <div class="clock" id="clock" role="timer" aria-live="off" aria-label="Exam duration: 2 hours">02:00:00</div>
  <div class="ready-warning" id="readyWarning" role="note">
    <p>Turn on your desktop.</p>
    <p>Do not open your question paper.</p>
    <p>You will face penalty if you start early.</p>
  </div>
  <p class="stage-message" id="stageMessage" aria-live="polite" hidden></p>
  <button class="start" id="startButton" type="button" disabled>Start exam</button>
  <p class="storage-notice" id="storageNotice" role="status" hidden>Keep this page open. The timer may not restore correctly if you reload.</p>
</main>
<footer>
  <a href="index.html">Exam guidelines</a>
  <details id="timerControls">
    <summary>Timer controls</summary>
    <div class="control-actions">
      <button type="button" id="resetButton">Reset to pre-exam warning</button>
    </div>
  </details>
</footer>
<noscript>JavaScript is required to run the exam timer.</noscript>
<script>
(() => {
  "use strict";
  const EXAM_MS = 2 * 60 * 60 * 1000;
  const SUBMISSION_MS = 5 * 60 * 1000;
  const KEY = "ine315-final-exam-timer-v1";
  const endInstruction = "Wait until we collect all the papers and count through. Do not leave the exam venue.";
  const byId = id => document.getElementById(id);
  const phaseLabel = byId("phaseLabel");
  const clock = byId("clock");
  const clockLabel = byId("clockLabel");
  const readyWarning = byId("readyWarning");
  const stageMessage = byId("stageMessage");
  const startButton = byId("startButton");
  const resetButton = byId("resetButton");
  const fullscreenButton = byId("fullscreenButton");
  const storageNotice = byId("storageNotice");
  let storageWorks = true;

  function decode(raw) {
    if (!raw) return null;
    try {
      const saved = JSON.parse(raw);
      if (saved && saved.version === 1 && Number.isSafeInteger(saved.startedAt) &&
          saved.startedAt > 0 && saved.startedAt <= Date.now()+1000) {
        return {startedAt:saved.startedAt};
      }
    } catch (_) {}
    return null;
  }
  function readSaved() {
    if (!storageWorks) return null;
    try { return decode(window.localStorage.getItem(KEY)); }
    catch (_) { storageWorks=false; return null; }
  }
  let state = readSaved() || {startedAt:null};

  function persist() {
    try {
      if (state.startedAt === null) window.localStorage.removeItem(KEY);
      else window.localStorage.setItem(KEY,JSON.stringify({version:1,startedAt:state.startedAt}));
    } catch (_) { storageWorks=false; }
  }
  function formatTime(ms,includeHours) {
    const seconds = Math.max(0,Math.ceil(ms/1000));
    const h = Math.floor(seconds/3600);
    const m = Math.floor((seconds%3600)/60);
    const s = seconds%60;
    const pad = n => String(n).padStart(2,"0");
    return includeHours ? pad(h)+":"+pad(m)+":"+pad(s) : pad(Math.floor(seconds/60))+":"+pad(s);
  }
  function viewAt(now) {
    if (state.startedAt === null) {
      return {phase:"ready",urgency:"normal",label:"The exam has not started",
              clockLabel:"Exam duration",remaining:EXAM_MS,message:""};
    }
    const examEnd = state.startedAt+EXAM_MS;
    const submissionEnd = examEnd+SUBMISSION_MS;
    if (now < examEnd) {
      const remaining = Math.min(EXAM_MS,examEnd-now);
      const minutes = Math.ceil(remaining/60000);
      const urgency = remaining<=5*60000 ? "critical" : remaining<=15*60000 ? "warning" : "normal";
      return {phase:"exam",urgency,
              label:urgency==="normal" ? "Exam in progress" : minutes+" "+(minutes===1?"minute":"minutes")+" left",
              clockLabel:"Exam time remaining",remaining,message:""};
    }
    if (now < submissionEnd) {
      return {phase:"submission",urgency:"normal",label:"Additional time for submission",
              clockLabel:"Submission time remaining",remaining:submissionEnd-now,
              message:"Stop writing. Submit your work now."};
    }
    return {phase:"finished",urgency:"normal",label:"Exam ended",clockLabel:"Time remaining",
            remaining:0,message:endInstruction};
  }
  function render() {
    const view = viewAt(Date.now());
    document.body.dataset.phase = view.phase;
    document.body.dataset.urgency = view.urgency;
    if (phaseLabel.textContent !== view.label) phaseLabel.textContent = view.label;
    clock.textContent = formatTime(view.remaining,view.phase==="ready" || view.phase==="exam");
    clockLabel.textContent = view.clockLabel;
    clock.setAttribute("aria-label",view.clockLabel+": "+clock.textContent);
    readyWarning.hidden = view.phase!=="ready";
    stageMessage.hidden = !view.message;
    if (stageMessage.textContent !== view.message) stageMessage.textContent=view.message;
    startButton.hidden = view.phase!=="ready";
    startButton.disabled = view.phase!=="ready";
    storageNotice.hidden = storageWorks || view.phase==="ready";
    document.title = view.phase==="finished" ? "Exam ended · INE 315" : clock.textContent+" · INE 315 exam timer";
  }
  startButton.addEventListener("click",() => {
    if (state.startedAt !== null) return;
    state = readSaved() || {startedAt:Date.now()};
    persist();
    render();
  });
  resetButton.addEventListener("click",() => {
    state = {startedAt:null};
    persist();
    byId("timerControls").open=false;
    render();
  });
  fullscreenButton.addEventListener("click",async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
    } catch (_) {}
  });
  document.addEventListener("fullscreenchange",() => {
    const active=Boolean(document.fullscreenElement);
    fullscreenButton.textContent=active?"Exit full screen":"Full screen";
    fullscreenButton.setAttribute("aria-label",active?"Exit full screen":"Enter full screen");
  });
  window.addEventListener("storage",event => {
    if (event.key!==KEY && event.key!==null) return;
    if (event.newValue===null) state={startedAt:null};
    else {
      const updated=decode(event.newValue);
      if (!updated) return;
      state=updated;
    }
    render();
  });
  document.addEventListener("visibilitychange",render);
  window.addEventListener("focus",render);
  window.setInterval(render,250);
  render();
})();
</script>
</body>
</html>
